<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 20" width="1000" height="20" aria-hidden="true">
<defs>
<radialGradient id="g1" cx="80%" cy="50%" r="60%"><stop offset="0" stop-color="#00f7ff" stop-opacity=".22"/><stop offset="1" stop-color="#04040a" stop-opacity="0"/></radialGradient>
<radialGradient id="g2" cx="0%" cy="100%" r="60%"><stop offset="0" stop-color="#eb142d" stop-opacity=".2"/><stop offset="1" stop-color="#04040a" stop-opacity="0"/></radialGradient>
<radialGradient id="core"><stop offset="0" stop-color="#fff"/><stop offset=".5" stop-color="#00f7ff"/><stop offset="1" stop-color="#00f7ff" stop-opacity=".1"/></radialGradient>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#00f7ff" stroke-opacity=".06"/></pattern>
<pattern id="segp" width="22" height="6" patternUnits="userSpaceOnUse"><rect width="16" height="6" fill="#fff"/></pattern>
<linearGradient id="swR" x1="0" x2="1"><stop offset="0" stop-color="#eb142d" stop-opacity="0"/><stop offset=".75" stop-color="#ff3b55"/><stop offset="1" stop-color="#fff"/></linearGradient>
<linearGradient id="swC" x1="1" x2="0"><stop offset="0" stop-color="#00f7ff" stop-opacity="0"/><stop offset=".75" stop-color="#00f7ff"/><stop offset="1" stop-color="#fff"/></linearGradient>
<linearGradient id="ul" x1="0" x2="1"><stop offset="0" stop-color="#00f7ff"/><stop offset="1" stop-color="#eb142d"/></linearGradient>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
