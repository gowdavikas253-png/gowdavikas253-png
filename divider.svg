<mask id="dm"><rect x="0" y="9" width="1000" height="3" fill="url(#segp)"/></mask>
<g mask="url(#dm)"><rect x="0" y="9" width="1000" height="3" fill="#00f7ff" opacity=".18"/><rect y="9" width="300" height="3" fill="url(#swR)"><animate attributeName="x" from="-300" to="1000" dur="3s" repeatCount="indefinite"/></rect></g>
<g transform="translate(500 10)"><rect x="-5" y="-5" width="10" height="10" fill="#eb142d" transform="rotate(45)"><animateTransform attributeName="transform" type="rotate" from="45" to="405" dur="6s" repeatCount="indefinite"/></rect></g>
